<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisaab</title>
<meta name="description" content="Hisaab — track expenses, income, transfers, EMIs and budgets across cash, bank, cards and loans.">
<meta name="theme-color" content="#F1F3F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%233D58E6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231B2780%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20transform%3D%22translate%280.0%200.0%29%20scale%281.0%29%22%3E%3Cpath%20d%3D%22M70%20158H442M70%20222H442M70%20286H442M70%20350H442M70%20414H442%22%20stroke%3D%22%23FFFFFF%22%20stroke-opacity%3D%22.11%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M138%2070V442%22%20stroke%3D%22%23FFB547%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2240%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M186%20146H372%22/%3E%3Cpath%20d%3D%22M186%20218H372%22/%3E%3Cpath%20d%3D%22M186%20146H256C336%20146%20336%20298%20256%20298H196L356%20424%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script>
  (function(){ try{ var t=localStorage.getItem('hisaab-theme')||'system';
    if(t==='system') t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);}catch(e){} })();
</script>
<style>
/* Layout: phone-first single column (max 560px), sticky view header, fixed bottom tab bar + add button, bottom sheets for every form. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F5F6FA; --line:#E1E4ED;
  --ink:#141A2E; --muted:#5F677C; --accent:#3046C8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --income:#0F7B53; --expense:#C93A31; --transfer:#5F677C; --warn:#A8670F;
  --c-in:#1baf7a; --c-out:#eb6834;
  --scrim:rgb(10 14 30 / .46); --shadow:0 10px 30px rgb(20 26 46 / .16);
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-body:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tab-h:62px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --line:#2A303C;
  --ink:#E9ECF3; --muted:#949CAE; --accent:#8B9BFF; --accent-ink:#0D1015; --accent-soft:#232A4D;
  --income:#45CF95; --expense:#FF7A6E; --transfer:#A3ABBD; --warn:#E8B04A;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}
html[data-theme="ocean"]{
  --bg:#081A26; --surface:#0F2535; --surface-2:#143043; --line:#1F4057;
  --ink:#E3F2F7; --muted:#8CABBA; --accent:#3CD3E0; --accent-ink:#03222B; --accent-soft:#123F4D;
  --income:#5FE0A2; --expense:#FF8C7C; --transfer:#9DB8C4; --warn:#F2C14E;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}
html[data-theme="mint"]{
  --bg:#ECF4F0; --surface:#FFFFFF; --surface-2:#F3F8F5; --line:#D6E5DD;
  --ink:#10261D; --muted:#557064; --accent:#0B7A5C; --accent-ink:#FFFFFF; --accent-soft:#DBEFE6;
  --income:#0B7A5C; --expense:#C2412E; --transfer:#557064; --warn:#9A6410;
  --c-in:#1baf7a; --c-out:#eb6834; color-scheme:light;
}
html[data-theme="rose"]{
  --bg:#FAF0F2; --surface:#FFFFFF; --surface-2:#FCF5F6; --line:#EFDAE0;
  --ink:#2A1219; --muted:#7A5C64; --accent:#B3305C; --accent-ink:#FFFFFF; --accent-soft:#F7E0E8;
  --income:#13774F; --expense:#BC3828; --transfer:#7A5C64; --warn:#9A6410;
  --c-in:#1baf7a; --c-out:#eb6834; color-scheme:light;
}
html[data-theme="royal"]{
  --bg:#140F24; --surface:#1D1633; --surface-2:#251D40; --line:#352A5C;
  --ink:#EFEAFB; --muted:#A79FC4; --accent:#E8B84D; --accent-ink:#1A1206; --accent-soft:#3B2F1B;
  --income:#62D59E; --expense:#FF8089; --transfer:#B3ABCE; --warn:#E8B84D;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.amt{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

#app{max-width:560px;margin:0 auto;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 90px)}
#view{padding-inline:16px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;margin-inline:-16px;padding-inline:16px}
.brand{font:800 27px/1 var(--f-display);letter-spacing:-.025em}
.brand-row{display:flex;align-items:center;gap:11px}
.logo-sm{width:42px;height:42px;flex:none;display:block;filter:drop-shadow(0 4px 10px rgb(27 39 128 / .28))}
.logo-svg{display:block;width:100%;height:100%}
.brand-sm{font:700 22px/1.1 var(--f-display);letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.top-actions{display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.danger{color:var(--expense)}
.icon-btn.boxed{background:var(--surface);border:1px solid var(--line)}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:800 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* hero (passbook ruled card) */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:var(--accent);color:var(--accent-ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 25px,color-mix(in srgb,var(--accent-ink) 9%,transparent) 25px 26px)}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:54px;width:1px;background:color-mix(in srgb,var(--accent-ink) 16%,transparent)}
.hero>*{position:relative;z-index:1;padding-left:48px}
.hero .lbl{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero .big{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;font-weight:600;opacity:.92}
.hero .mark{position:absolute;left:14px;top:18px;padding:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 16px/1 var(--f-display);background:color-mix(in srgb,var(--accent-ink) 16%,transparent)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.tile .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.tile .v{font:700 clamp(15px,4.3vw,17px)/1.2 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.v.inc,.amt.inc{color:var(--income)} .v.exp,.amt.exp{color:var(--expense)} .amt.trf{color:var(--transfer)}

/* month summary */
.msum{padding:14px;display:flex;flex-direction:column;gap:12px}
.msum .rowx{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.msum h3{margin:0;font:700 16px/1.2 var(--f-display)}

/* accounts strip */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:none;width:158px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.acc .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;min-width:0}
.acc .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .b{font:700 18px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.acc .s{font-size:11.5px;color:var(--muted);font-weight:600}
.acc.add{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;font-weight:700;width:120px}
.emo{font-size:18px;line-height:1}

/* transaction rows */
.txlist{padding:2px 14px}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;text-align:left}
.tx:last-child{border-bottom:0}
.ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#8D99AE) 20%,transparent);color:var(--ink)}
.ci.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.tx-title{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.tx-meta .ic{opacity:.8}
.tx .amt{font-weight:800;font-size:15px;white-space:nowrap}
.tx.future{opacity:.62}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.pill.acc-p{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:12.5px;font-weight:800;color:var(--muted)}
.dayhead:first-child{padding-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font:700 16px/1.3 var(--f-display)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink)}
.banner .ic{color:var(--accent);margin-top:2px}
.banner p{margin:0;font-size:13.5px;font-weight:600}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.warn .ic{color:var(--warn)}

/* chips & segmented */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--accent)}
.chip small{font-weight:600;opacity:.75}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.t-expense{color:var(--expense)} .seg button.on.t-income{color:var(--income)} .seg button.on.t-transfer{color:var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-height:46px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-field{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-bottom:2px solid var(--line);padding:4px 2px;text-align:left;cursor:text;color:inherit}
.amount-field.active{border-color:var(--accent)}
.amt-text{font:800 38px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
.amt-text.ph{color:var(--muted);opacity:.55}
.t-expense .amt-text:not(.ph){color:var(--expense)} .t-income .amt-text:not(.ph){color:var(--income)} .t-transfer .amt-text:not(.ph){color:var(--accent)}
.caret{flex:none;width:2px;height:34px;border-radius:2px;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keypad-amt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kp{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 22px/1 var(--f-display);color:var(--ink);display:grid;place-items:center}
.kp.op{background:var(--surface-2);color:var(--accent)}
.kp.done{grid-column:span 2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font:800 16px/1 var(--f-body)}
.kp:active{transform:scale(.96)}
.amount-field .cur{font:700 30px/1 var(--f-display);color:var(--muted)}
.amount-field input{border:0;background:none;box-shadow:none!important;padding:4px 0;font:800 38px/1.1 var(--f-display);letter-spacing:-.02em;min-height:0}
.t-expense .amount-field input{color:var(--expense)} .t-income .amount-field input{color:var(--income)} .t-transfer .amount-field input{color:var(--accent)}
.calc{font-size:13px;font-weight:700;color:var(--muted);min-height:18px}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 8px;border-radius:14px;border:1px solid transparent;background:none;min-width:0}
.cat span:last-child{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.toggle-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.toggle-row>span:nth-child(2){flex:1;min-width:0}
.toggle-row b{display:block;font-size:14.5px}
.toggle-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(18px)}
.emi-box{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.emi-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.emi-sum b{display:block;font:700 16px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.receipt-thumb{display:flex;gap:12px;align-items:center}
.receipt-thumb img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.from-sms{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 14.5px/1.1 var(--f-body);border-radius:12px;padding:13px 16px;border:1px solid transparent;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--expense);color:#fff}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* tab bar + fab */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
#tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted)}
#tabbar button.on{color:var(--accent)}
#fab{position:fixed;z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);
  right:max(16px,calc(50% - 280px + 16px));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:560px;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:94vh;height:94dvh}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.dlg{align-items:center;padding:16px}
.sheet.dialog{border-radius:18px;max-width:400px;transform:scale(.96);opacity:0;transition:transform .18s,opacity .18s}
.sheet-wrap.open .sheet.dialog{transform:none;opacity:1}

const APP_VERSION = '1.4.0';

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const round2 = n => Math.round((+n || 0) * 100) / 100;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseYmd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const monthEnd = mk => { const [y, m] = mk.split('-').map(Number); return `${mk}-${pad(new Date(y, m, 0).getDate())}`; };
const shiftMonth = (mk, n) => addMonths(mk + '-01', n).slice(0, 7);

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate = s => { const d = parseYmd(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parseYmd(s); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const fmtDay = s => { const t = today(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; if (s === addDays(t, 1)) return 'Tomorrow';
  const d = parseYmd(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, signed) => { n = round2(n); const a = Math.abs(n); const s = (Math.round(a * 100) % 100 ? nf2 : nf0).format(a);
  return (n < 0 ? '−' : (signed && n > 0 ? '+' : '')) + '₹' + s; };
const compact = n => { const a = Math.abs(n); let s;
  if (a >= 1e7) s = (+(a / 1e7).toFixed(a >= 1e9 ? 0 : 2)) + 'Cr';
  else if (a >= 1e5) s = (+(a / 1e5).toFixed(a >= 1e6 ? 1 : 2)) + 'L';
  else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
  else s = String(Math.round(a));
  return (n < 0 ? '−' : '') + '₹' + s; };
const rupees = n => Math.abs(n) >= 1e7 ? compact(n) : money(Math.round(n));
const tileAmt = n => { const r = rupees(n); return r.replace('−', '').length > 8 ? compact(n) : r; };
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const normKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 30);

/* safe calculator for the amount field: 120+80, 1500/3 … */
function evalAmount(str) {
  str = String(str || '').replace(/[₹,\s]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
  if (!str) return 0;
  if (!/^[0-9+\-*/().]+$/.test(str)) return NaN;
  let i = 0; const peek = () => str[i];

  const factor = () => { if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; } if (peek() === '-') { i++; return -factor(); } return num(); };
  const term = () => { let v = factor(); while (peek() === '*' || peek() === '/') { const op = str[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (peek() === '+' || peek() === '-') { const op = str[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); if (i !== str.length || !isFinite(v)) return NaN; return round2(v); } catch (e) { return NaN; }
}

const DB = {
  db: null, fallback: false, mem: new Map(),
  open() { return new Promise((res, rej) => { if (!('indexedDB' in window)) return rej(new Error('no idb'));
    const r = indexedDB.open('hisaab', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('receipts'); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  run(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
    if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  get(st, k) { if (this.fallback) return Promise.resolve(st === 'kv' ? JSON.parse(localStorage.getItem('hisaab-' + k) || 'null') : this.mem.get(k)); return this.run(st, 'readonly', s => s.get(k)); },
  put(st, k, v) { if (this.fallback) { if (st === 'kv') localStorage.setItem('hisaab-' + k, JSON.stringify(v)); else this.mem.set(k, v); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.put(v, k)); },
  del(st, k) { if (this.fallback) { this.mem.delete(k); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.delete(k)); },
  keys(st) { if (this.fallback) return Promise.resolve([...this.mem.keys()]); return this.run(st, 'readonly', s => s.getAllKeys()); },
  clear(st) { if (this.fallback) { this.mem.clear(); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.clear()); }
};

const accById = id => S.accounts.find(a => a.id === id);
const catById = id => S.categories.find(c => c.id === id);
const subName = (c, sid) => (c && c.subs.find(s => s.id === sid)?.name) || '';
const activeAccounts = () => S.accounts.filter(a => !a.archived);
const isLiab = a => ACC_TYPES[a?.type]?.liab;
const fallbackCat = type => S.categories.find(c => c.type === type && /^(others|other income)$/i.test(c.name)) || S.categories.find(c => c.type === type);
function defaultAccountId() { const d = S.settings.defaultAccount; if (d && accById(d) && !accById(d).archived) return d;
  return (activeAccounts().find(a => a.type === 'bank') || activeAccounts()[0])?.id || ''; }
function balances() {
  const b = {}; S.accounts.forEach(a => b[a.id] = +a.opening || 0); const td = today();
  for (const t of S.txns) { if (t.date > td) continue;
    if (t.type === 'expense') b[t.accountId] = (b[t.accountId] || 0) - t.amount;
    else if (t.type === 'income') b[t.accountId] = (b[t.accountId] || 0) + t.amount;
    else { b[t.accountId] = (b[t.accountId] || 0) - t.amount; b[t.toAccountId] = (b[t.toAccountId] || 0) + t.amount; } }
  for (const k in b) b[k] = round2(b[k]); return b;
}
function rangeTotals(from, to) { let inc = 0, exp = 0; for (const t of S.txns) { if (t.date < from || t.date > to) continue; if (t.type === 'income') inc += t.amount; else if (t.type === 'expense') exp += t.amount; } return { inc: round2(inc), exp: round2(exp) }; }
function catSpent(catId, mk) { const from = mk + '-01', to = [monthEnd(mk), today()].sort()[0]; let s = 0;
  for (const t of S.txns) if (t.type === 'expense' && t.catId === catId && t.date >= from && t.date <= to) s += t.amount; return round2(s); }
function txTitle(t) {
  if (t.payee) return t.payee;
  if (t.type === 'transfer') return `${accById(t.accountId)?.name || '—'} → ${accById(t.toAccountId)?.name || '—'}`;
  const c = catById(t.catId); return subName(c, t.subId) || c?.name || 'Uncategorised';
}
function sortTx(a, b) { return (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')) || (b.createdAt || 0) - (a.createdAt || 0); }

const sheets = []; let ignorePop = 0, histPushed = false;
function openSheet(html, opts = {}) {
  const wrap = document.createElement('div'); wrap.className = 'sheet-wrap' + (opts.dialog ? ' dlg' : '');
  wrap.innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="sheet ${opts.cls || ''}${opts.dialog ? ' dialog' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  $('#layer').appendChild(wrap); requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  sheets.push({ wrap, onClose: opts.onClose }); document.body.classList.add('locked');
  if (!histPushed) { try { history.pushState({ hs: 1 }, ''); histPushed = true; } catch (e) {} }
  return wrap;
}
function closeSheet(fromPop) {
  const s = sheets.pop(); if (!s) return;
  s.wrap.classList.remove('open'); setTimeout(() => s.wrap.remove(), 260);
  if (!sheets.length) document.body.classList.remove('locked');
  if (fromPop) { histPushed = false; if (sheets.length) { try { history.pushState({ hs: 1 }, ''); histPushed = true; } catch (e) {} } }
  else if (!sheets.length && histPushed) { histPushed = false; ignorePop++; history.back(); }
  s.onClose && s.onClose();
}

  }

function loadImage(file) { return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); }; img.src = url; }); }
async function compressImage(file, max = 1400, q = .72) {
  const img = await loadImage(file); const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', q));
}
async function onReceiptFile(file) {
  if (!file || !TF) return;
  try { const blob = await compressImage(file); if (TF.receiptUrl) URL.revokeObjectURL(TF.receiptUrl); TF.receiptBlob = blob; TF.receiptUrl = URL.createObjectURL(blob); TF.receipt = null; refreshTx(); toast('Receipt attached'); }
  catch (e) { toast(e.message); }
}

function parseStatementSms(raw) {

  const dk = text.match(/(?:payment due date|due date|due by|due on|pay by|payable by)\s*(?:is|:|-|of)?\s*/i);
  const due = dk ? parseDateAny(text.slice(dk.index + dk[0].length, dk.index + dk[0].length + 24)) : '';

  const total = round2(parseFloat(tot[1].replace(/,/g, ''))); if (!(total > 0)) return null;

}

async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

function renderLock(msg, bad) {

  el.innerHTML = `<div class="lock-in"><div class="logo">${LOGO}</div><h2>Hisaab is locked</h2><p class="lmsg${bad ? ' bad' : ''}">${esc(msg || 'Enter your 4-digit PIN')}</p><div class="dots${bad ? ' shake' : ''}">${[0, 1, 2, 3].map(i => `<i class="${i < LK.buf.length ? 'on' : ''}"></i>`).join('')}</div><div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k === '' ? '<span></span>' : `<button data-pin="${k}" aria-label="${k === 'del' ? 'Delete' : k}">${k === 'del' ? '⌫' : k}</button>`).join('')}</div>${S.settings.bioId ? `<button class="btn ghost" data-pin="bio">${ic('finger', 20)} Use fingerprint</button>` : ''}<button class="link" data-pin="forgot">Forgot PIN?</button></div>`;
}
function unlock() { LK.on = false; $('#lock')?.remove(); const cb = LK.cb; LK.cb = null; cb && cb(); }
async function lockKey(v) {

  if (v === 'bio') { if (LK.bioBusy) return; LK.bioBusy = true;
    try { if (await bioVerify()) { LK.fails = 0; LK.bioBusy = false; return unlock(); } } catch (e) { LK.bioBusy = false; return renderLock('Tap “Use fingerprint” or enter your PIN.'); }
    LK.bioBusy = false; return; }
  if (v === 'erase') { await DB.clear('receipts').catch(() => {}); S = defaultState(); S.settings.onboarded = true; await saveNow(); unlock(); render(); toast('Hisaab was erased. Restore your backup from More › Backup & restore.', 5000); return; }
  if (Date.now() < LK.until) return renderLock(`Too many tries. Wait ${Math.ceil((LK.until - Date.now()) / 1000)} seconds.`, true);
  if (v === 'del') LK.buf = LK.buf.slice(0, -1); else if (/^\d$/.test(v) && LK.buf.length < 4) LK.buf += v;

const isAndroid = /Android/i.test(navigator.userAgent);
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER = 'Hisaab Backups';
let driveToken = '', driveTokenExp = 0, gisPromise = null;
function loadGis() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { gisPromise = null; rej(new Error('Could not reach Google. Check your internet connection.')); }; document.head.appendChild(s); });
  return gisPromise;
}
function getDriveToken() {
  if (driveToken && Date.now() < driveTokenExp - 60000) return Promise.resolve(driveToken);
  if (location.protocol === 'file:') return Promise.reject(new Error('Open Hisaab from its web link (github.io), not from a downloaded file.'));
  return loadGis().then(() => new Promise((res, rej) => {
    const tc = google.accounts.oauth2.initTokenClient({ client_id: S.settings.driveClientId, scope: DRIVE_SCOPE,
      callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); driveToken = r.access_token; driveTokenExp = Date.now() + (+r.expires_in || 3600) * 1000; res(driveToken); },
      error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? 'Google sign-in was closed before it finished' : e && e.type === 'popup_failed_to_open' ? 'Google sign-in could not open. Allow pop-ups for this site and try again' : (e && (e.message || e.type)) || 'Google sign-in failed')) });
    tc.requestAccessToken({ prompt: S.settings.driveOn ? '' : 'consent' });
  }));
}
async function gfetch(url, opts = {}) {
  const t = await getDriveToken();
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + t, ...(opts.headers || {}) } });
  if (r.status === 401) { driveToken = ''; throw new Error('Google sign-in expired. Tap again.'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) {} throw new Error(`Google Drive said: ${m || r.status}`); }
  return r;
}
async function driveFolderId() {
  const q = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const found = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`)).json();
  if (found.files && found.files.length) return found.files[0].id;
  const made = await (await gfetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) })).json();
  return made.id;
}
async function driveListBackups(folder) {
  folder ||= await driveFolderId();
  const q = encodeURIComponent(`'${folder}' in parents and trashed=false`);
  const r = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,size,modifiedTime)&spaces=drive`)).json();
  return { folder, files: r.files || [] };
}
async function driveUpload(json) {
  const { folder, files } = await driveListBackups();
  const name = `Hisaab-backup-${today()}.json`, same = files.find(f => f.name === name);
  const meta = same ? { name } : { name, parents: [folder], mimeType: 'application/json' };
  const b = 'hisaab' + Date.now();
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n`, json, `\r\n--${b}--`]);
  await gfetch(same ? `https://www.googleapis.com/upload/drive/v3/files/${same.id}?uploadType=multipart&fields=id` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    { method: same ? 'PATCH' : 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body });
  const old = files.filter(f => f.name !== name).slice(29); // keep the latest 30 backups
  for (const f of old) await gfetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method: 'DELETE' }).catch(() => {});
}

const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));

async function bioRegister() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Hisaab' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'Hisaab app lock', displayName: 'Hisaab app lock' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
  return b64u(cred.rawId);
}
async function bioVerify() {
  const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64u(S.settings.bioId) }], userVerification: 'required', timeout: 60000 } });
  return !!a;
}

  budMonth: b => { ui.budMonth = shiftMonth(ui.budMonth, +b.dataset.d); render(); },
  emisSheet: () => { const w = openSheet(emisHTML(), { cls: 'tall' }); w._kind = 'emis'; },
  emiDetail: b => openSheet(emiDetailHTML(b.dataset.id), { cls: 'tall' }),
  emiStop: async b => { const id = b.dataset.id; const fut = S.txns.filter(t => t.emiId === id && t.date > today()); if (!fut.length) return toast('No future EMIs left in this plan');
    if (!(await confirmBox(`Remove ${fut.length} future instalments? Paid ones stay.`, 'Remove'))) return; S.txns = S.txns.filter(t => !(t.emiId === id && t.date > today())); save(); closeSheet(); afterManagerChange(); toast('Future EMIs removed'); },
  emiDelete: async b => { const id = b.dataset.id; if (!(await confirmBox('Delete this plan and all its instalments, including paid ones?'))) return;
    S.txns = S.txns.filter(t => t.emiId !== id); S.emis = S.emis.filter(p => p.id !== id); save(); closeSheet(); afterManagerChange(); toast('EMI plan deleted'); },
  txMonth: b => { ui.txMonth = shiftMonth(ui.txMonth, +b.dataset.d); render(); },
  txAllToggle: () => { ui.txMonth = ui.txMonth === 'all' ? today().slice(0, 7) : 'all'; render(); },
  txType: b => { ui.txType = b.dataset.v; render(); },
  period: b => { ui.statsPeriod = b.dataset.v; ui.expandCat = ''; render(); },
  expandCat: b => { ui.expandCat = ui.expandCat === b.dataset.id ? '' : b.dataset.id; render(); },
  theme: b => { S.settings.theme = b.dataset.v; save(); applyTheme(); render(); },
  exportSheet: () => { exportPreset(ui.tab === 'txns' && ui.txMonth !== 'all' ? 'month' : 'month'); if (ui.tab === 'txns' && ui.txMonth !== 'all') { EX.from = ui.txMonth + '-01'; EX.to = monthEnd(ui.txMonth); EX.preset = ui.txMonth === today().slice(0, 7) ? 'month' : ''; }
    EXw = openSheet(exportHTML(), { onClose: () => { EXw = null; } }); },
  exPreset: b => { exportPreset(b.dataset.v); setSheet(EXw, exportHTML()); },
  exType: b => { EX.type = b.dataset.v; setSheet(EXw, exportHTML()); },
  doExport: () => { try { const blob = buildWorkbook(); let f = EX.from, t = EX.to; if (f > t) [f, t] = [t, f]; downloadBlob(blob, `Hisaab_${f}_to_${t}.xlsx`); toast('Excel file saved to your Downloads'); } catch (e) { toast('Export failed: ' + e.message); } },
  backupSheet: () => openBackupSheet(),
  taxSheet: () => { ui.taxFy ||= fyOf(today()); const w = openSheet(taxHTML(), { cls: 'tall' }); w._kind = 'tax'; },
  taxFy: b => { ui.taxFy = +b.dataset.v; ui.taxOpen = ''; refreshTax(); },
  taxOpen: b => { ui.taxOpen = ui.taxOpen === b.dataset.v ? '' : b.dataset.v; refreshTax(); },
  taxAdd: b => openSheet(taxAddHTML(b.dataset.v || '')),
  taxAddSave: () => { const amt = evalAmount($('#taAmt').value); if (!(amt > 0)) return toast('Enter the amount');
    S.tax.extra.push({ id: uid(), fy: ui.taxFy || fyOf(today()), tag: $('#taTag').value, amount: amt, note: $('#taNote').value.trim() }); save(); closeSheet(); afterManagerChange(); toast('Added to the tax report'); },
  taxDelExtra: async b => { if (!(await confirmBox('Remove this amount from the tax report?', 'Remove'))) return; S.tax.extra = S.tax.extra.filter(x => x.id !== b.dataset.id); save(); afterManagerChange(); },
  taxProfile: () => { TP = { ...S.tax.profile }; const w = openSheet(taxProfileHTML(), { cls: 'tall', onClose: () => { TP = null; } }); w._kind = 'taxprofile'; },
  tpToggle: b => { readTP(); TP[b.dataset.v] = !TP[b.dataset.v]; const w = b.closest('.sheet-wrap'); const keep = { ...S.tax.profile }; S.tax.profile = TP; setSheet(w, taxProfileHTML()); S.tax.profile = keep; },
  tpRegime: b => { readTP(); TP.regime = b.dataset.v; const w = b.closest('.sheet-wrap'); const keep = { ...S.tax.profile }; S.tax.profile = TP; setSheet(w, taxProfileHTML()); S.tax.profile = keep; },
  tpSave: () => { readTP(); for (const k of ['salary', 'basic', 'hra', 'other']) { if (TP[k] !== '' && isNaN(+TP[k])) return toast('Check the amounts: numbers only'); }
    S.tax.profile = { ...TP }; save(); closeSheet(); afterManagerChange(); toast('Saved'); },
  taxExport: () => { const fy = ui.taxFy || fyOf(today()); try { downloadBlob(taxWorkbook(fy), `Hisaab_Tax_${fyLabel(fy).replace(/\s/g, '_')}.xlsx`); toast('Tax summary saved to your Downloads'); } catch (e) { toast('Export failed: ' + e.message); } },
  taxNewRegime: () => { S.tax.profile.regime = 'new'; save(); render(); toast('Got it. No more 80C reminders. You can change this in More › Tax report.', 4500); },
  driveSetup: () => openDriveSetup(),
  driveConnect: () => { const v = $('#driveCid').value.trim().replace(/\s+/g, '');
    if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(v)) return toast('That is not a Client ID. It ends in .apps.googleusercontent.com', 4500);
    if (v !== S.settings.driveClientId) { driveToken = ''; S.settings.driveOn = false; }
    S.settings.driveClientId = v; save(); closeSheet(); driveBackup(); },
  driveForget: () => { S.settings.driveClientId = ''; S.settings.driveOn = false; driveToken = ''; save(); closeSheet(); refreshBackupSheet(); render(); toast('Google Drive disconnected'); },
  copyOrigin: async () => { const t = $('#driveOrigin').textContent; try { await navigator.clipboard.writeText(t); toast('Address copied'); } catch (e) { toast('Select the address and copy it'); } },
  driveBackup: () => driveBackup(),
  driveRestore: () => driveRestoreList(),
  driveRestorePick: b => { const id = b.dataset.id; closeSheet(); setTimeout(() => driveRestorePick(id), 280); },
  bioToggle: async b => { const w = b.closest('.sheet-wrap');
    if (S.settings.bioId) { S.settings.bioId = ''; await saveNow(); setSheet(w, pinHTML()); render(); return toast('Fingerprint unlock is off'); }
    if (!(await bioAvailable())) return toast('Fingerprint unlock is not available here. Check that a fingerprint is set up in your phone settings and that Hisaab is open in Chrome.', 5500);
    try { S.settings.bioId = await bioRegister(); await saveNow(); setSheet(w, pinHTML()); render(); toast('Fingerprint unlock is on'); }
    catch (e) { toast(e.name === 'NotAllowedError' ? 'Fingerprint setup was cancelled' : 'Could not set up fingerprint: ' + e.message, 4500); } },
  backupShare: () => backupShare().then(refreshBackupSheet),
  backupDownload: () => backupDownload().then(refreshBackupSheet),
  pickFolder: () => pickBackupFolder(),
  folderGrant: () => folderGrant(),
  toggleReminder: () => { S.settings.backupReminder = !S.settings.backupReminder; save(); refreshBackupSheet(); render(); },
  toggleReceipts: () => { S.settings.includeReceipts = !S.settings.includeReceipts; save(); refreshBackupSheet(); },
  restore: () => $('#inRestore').click(),
  clearSample: async () => { if (!(await confirmBox('Remove all sample data and start with empty accounts?', 'Clear'))) return; const th = S.settings.theme; await DB.clear('receipts').catch(() => {}); S = defaultState(); S.settings.theme = th; S.settings.onboarded = true; saveNow(); render(); A.accountsSheet(); toast('Sample data cleared. Set your opening balances.'); },
  wipeAll: async () => { if (!(await confirmBox('Erase every account, transaction, budget and receipt on this device? This cannot be undone. Back up first if you need the data.', 'Erase everything'))) return;
    const th = S.settings.theme; await DB.clear('receipts').catch(() => {}); S = defaultState(); S.settings.theme = th; S.settings.onboarded = true; await saveNow(); render(); toast('All data erased'); },
  startFresh: () => { S.settings.onboarded = true; save(); closeSheet(); setTimeout(() => A.accountsSheet(), 280); },
  loadSample: () => { closeSheet(); loadSample(); toast('Sample data loaded. Clear it from the banner on Home.'); }
};
let TP = null;
function readTP() { if (!TP) return; const g = id => { const e = $('#' + id); return e ? String(evalAmount(e.value || '0') || (e.value.trim() ? e.value.trim() : '')) : undefined; };
  const m = { tpSalary: 'salary', tpBasic: 'basic', tpHra: 'hra', tpOther: 'other' }; for (const [id, k] of Object.entries(m)) { const v = g(id); if (v !== undefined) TP[k] = v === '0' ? '' : v; } }
function refreshTax() { for (const s of sheets) if (s.wrap._kind === 'tax') { const b = $('.sh-body', s.wrap), st = b ? b.scrollTop : 0; setSheet(s.wrap, taxHTML()); const nb = $('.sh-body', s.wrap); if (nb) nb.scrollTop = st; } }
function afterManagerChange() {
  render();
  for (const s of sheets) { const w = s.wrap; if (w._kind === 'accounts') setSheet(w, accountsHTML()); if (w._kind === 'cats') setSheet(w, catsHTML(w._type)); if (w._kind === 'emis') setSheet(w, emisHTML()); if (w._kind === 'card') setSheet(w, cardHTML(w._id)); if (w._kind === 'tax') refreshTax(); if (w._kind === 'bills') setSheet(w, billsHTML()); }
  if (TFw) refreshTx();
}
document.addEventListener('click', e => {
  const hit = e.target.closest('.chart .hit');
  if (hit) { const card = hit.closest('.chart'); $$('.hit.sel', card).forEach(x => x.classList.remove('sel')); hit.classList.add('sel'); $('.readout', card).textContent = hit.dataset.tip; return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.tf && TF) { TF[el.dataset.tf] = el.value;
    if (el.dataset.tf === 'amountStr') { const a = evalAmount(el.value); $('#tfCalc', TFw).textContent = /[+\-*/x×÷]/.test(el.value.replace(/^-/, '')) && a > 0 ? '= ' + money(a) : (isNaN(a) ? 'Check the amount' : ''); }
    if (['amountStr', 'emiMonths', 'emiRate', 'emiFirst'].includes(el.dataset.tf) && $('#tfEmiPrev', TFw)) $('#tfEmiPrev', TFw).innerHTML = emiPreview();
    if (el.dataset.tf === 'emiMonths') $$('[data-act="tfEmiM"]', TFw).forEach(c => c.classList.toggle('on', c.dataset.v === el.value));
  }
  if (el.dataset.af && AF) AF[el.dataset.af] = el.value;
  if (el.dataset.bf && BF) BF[el.dataset.bf] = el.value;
  if (el.dataset.cf && CF) CF[el.dataset.cf] = el.value;
  if (el.dataset.cfsub && CF) CF.subs[+el.dataset.cfsub].name = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'tfPayee' && TF && !TF.catId && TF.type !== 'transfer') { const m = S.payeeMap[normKey(el.value)]; if (m && m.type === TF.type && catById(m.catId)) { TF.catId = m.catId; TF.subId = m.subId; refreshTx(); toast('Category filled from last time'); } }
  if (el.dataset.tf === 'date' && TF && TF.emiOn && !TF.id) { TF.emiFirst = el.value; refreshTx(); }
  if (el.dataset.tf === 'date' && TF && TF.cur !== 'INR' && !TF.fxManual) loadRate();
  if (el.dataset.bf === 'catId' && BF) { BF.subId = ''; refreshBill(); }
  const on = el.dataset.on;
  if (on === 'customFrom') { ui.custom.from = el.value || today(); render(); }
  if (on === 'customTo') { ui.custom.to = el.value || today(); render(); }
  if (on === 'exFrom') { EX.from = el.value; EX.preset = ''; setSheet(EXw, exportHTML()); }
  if (on === 'exTo') { EX.to = el.value; EX.preset = ''; setSheet(EXw, exportHTML()); }
});
document.addEventListener('focusin', e => { if (TF && TF.pad && TFw && TFw.contains(e.target) && e.target.matches('input,textarea,select')) closePad(); });
document.addEventListener('keydown', e => {
  if (TF && TF.pad && TFw && !LK.on && sheets.length && sheets[sheets.length - 1].wrap === TFw && !e.target.matches('input,textarea,select')) {
    const map = { Backspace: 'del', Delete: 'C', Enter: 'done', x: '*', X: '*', '=': '=' }; const k = map[e.key] || (/^[\d.+\-*/]$/.test(e.key) ? e.key : '');
    if (k) { e.preventDefault(); padKey(k); return; } }
});
document.addEventListener('keydown', e => { if (LK.on && !LK.forgot) { if (/^\d$/.test(e.key)) { lockKey(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { lockKey('del'); e.preventDefault(); } return; } if (e.key === 'Enter' && e.target.id === 'cfNewSub') { e.preventDefault(); A.cfAddSub(); } if (e.key === 'Enter' && e.target.id === 'newSubName') { e.preventDefault(); A.tfAddSub(); } });

function showWelcome() {
  openSheet(`<div class="welcome"><div class="logo">${LOGO}</div><h2>Welcome to Hisaab</h2>
    <p>Track every rupee across cash, bank, cards and loans. Everything stays on this phone, and you can back it up to Google Drive any time.</p>
    <ul><li>Expenses, income, transfers and EMIs</li><li>Budgets with warnings at 80%</li><li>Daily, weekly and monthly averages</li><li>Receipts, Excel export, SMS detection</li></ul>
    <button class="btn primary block" data-act="startFresh">Set up my accounts</button>
    <button class="btn ghost block" data-act="loadSample">Explore with sample data first</button></div>`);
}

/* ---------------- boot ---------------- */
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); saveNow(); return; }
  if (S.settings.pin && !LK.on && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
  if (today() !== lastDay) { lastDay = today(); render(); writeAlerts(); }
  runAutopay(); setTimeout(checkClipboard, 450); autoFolderBackup();
});
async function boot() {
  try { await DB.open(); } catch (e) { DB.fallback = true; }
  try { S = await DB.get('kv', 'state'); } catch (e) { S = null; }
  if (!S) S = defaultState();
  migrate(S); applyTheme(); render();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  const after = () => { runAutopay(); render(); writeAlerts(); const shared = handleIncoming(); if (!S.settings.onboarded && !shared) showWelcome(); setTimeout(checkClipboard, 700); autoFolderBackup(); };
  if (S.settings.pin) showLock(after); else after();
  if (S.settings.driveClientId && navigator.onLine) setTimeout(() => loadGis().catch(() => {}), 2500);
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
</body>
