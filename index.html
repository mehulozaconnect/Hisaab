<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisaab</title>
<meta name="description" content="Hisaab — track expenses, income, transfers, EMIs and budgets across cash, bank, cards and loans.">
<meta name="theme-color" content="#F1F3F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g_green_512%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2322B573%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230B5E3B%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g_green_512%29%22%2F%3E%3Cg%20transform%3D%22translate%280.0%200.0%29%20scale%281.0%29%22%3E%3Cpath%20d%3D%22M70%20158H442M70%20222H442M70%20286H442M70%20350H442M70%20414H442%22%20stroke%3D%22%23FFFFFF%22%20stroke-opacity%3D%22.11%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M138%2070V442%22%20stroke%3D%22%23FFB547%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2240%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M186%20146H372%22%2F%3E%3Cpath%20d%3D%22M186%20218H372%22%2F%3E%3Cpath%20d%3D%22M186%20146H256C336%20146%20336%20298%20256%20298H196L356%20424%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script>
  (function(){ try{ var t=localStorage.getItem('hisaab-theme')||'system';
    if(t==='system') t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);}catch(e){} })();
</script>
<style>
/* Layout: phone-first single column (max 560px), sticky view header, fixed bottom tab bar + add button, bottom sheets for every form. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F5F6FA; --line:#E1E4ED;
  --ink:#141A2E; --muted:#5F677C; --accent:#3046C8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --income:#0F7B53; --expense:#C93A31; --transfer:#5F677C; --warn:#A8670F;
  --c-in:#1baf7a; --c-out:#eb6834;
  --scrim:rgb(10 14 30 / .46); --shadow:0 10px 30px rgb(20 26 46 / .16);
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-body:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tab-h:62px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --line:#2A303C;
  --ink:#E9ECF3; --muted:#949CAE; --accent:#8B9BFF; --accent-ink:#0D1015; --accent-soft:#232A4D;
  --income:#45CF95; --expense:#FF7A6E; --transfer:#A3ABBD; --warn:#E8B04A;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}
html[data-theme="ocean"]{
  --bg:#081A26; --surface:#0F2535; --surface-2:#143043; --line:#1F4057;
  --ink:#E3F2F7; --muted:#8CABBA; --accent:#3CD3E0; --accent-ink:#03222B; --accent-soft:#123F4D;
  --income:#5FE0A2; --expense:#FF8C7C; --transfer:#9DB8C4; --warn:#F2C14E;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}
html[data-theme="mint"]{
  --bg:#ECF4F0; --surface:#FFFFFF; --surface-2:#F3F8F5; --line:#D6E5DD;
  --ink:#10261D; --muted:#557064; --accent:#0B7A5C; --accent-ink:#FFFFFF; --accent-soft:#DBEFE6;
  --income:#0B7A5C; --expense:#C2412E; --transfer:#557064; --warn:#9A6410;
  --c-in:#1baf7a; --c-out:#eb6834; color-scheme:light;
}
html[data-theme="rose"]{
  --bg:#FAF0F2; --surface:#FFFFFF; --surface-2:#FCF5F6; --line:#EFDAE0;
  --ink:#2A1219; --muted:#7A5C64; --accent:#B3305C; --accent-ink:#FFFFFF; --accent-soft:#F7E0E8;
  --income:#13774F; --expense:#BC3828; --transfer:#7A5C64; --warn:#9A6410;
  --c-in:#1baf7a; --c-out:#eb6834; color-scheme:light;
}
html[data-theme="saffron"],html[data-theme="coral"]{
  --bg:#1D1E22; --surface:#26282D; --surface-2:#2F3239; --line:#3A3D45;
  --ink:#F4F2ED; --muted:#A4A39D; --accent:#F2A33A; --accent-ink:#22170A; --accent-soft:#45341C;
  --income:#4FCB8E; --expense:#F2776B; --transfer:#AEB4C0; --warn:#EBC75E;
  --c-in:#3BAF78; --c-out:#E0655A; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}
html[data-theme="royal"]{
  --bg:#140F24; --surface:#1D1633; --surface-2:#251D40; --line:#352A5C;
  --ink:#EFEAFB; --muted:#A79FC4; --accent:#E8B84D; --accent-ink:#1A1206; --accent-soft:#3B2F1B;
  --income:#62D59E; --expense:#FF8089; --transfer:#B3ABCE; --warn:#E8B84D;
  --c-in:#199e70; --c-out:#d95926; --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.amt{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

#app{max-width:560px;margin:0 auto;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 90px)}
#view{padding-inline:16px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;margin-inline:-16px;padding-inline:16px}
.brand{font:800 27px/1 var(--f-display);letter-spacing:-.025em}
.brand-row{display:flex;align-items:center;gap:11px}
.logo-sm{width:42px;height:42px;flex:none;display:block;filter:drop-shadow(0 4px 10px rgb(0 0 0 / .25))}
.logo-svg{display:block;width:100%;height:100%}
.brand-sm{font:700 22px/1.1 var(--f-display);letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.top-actions{display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.danger{color:var(--expense)}
.icon-btn.boxed{background:var(--surface);border:1px solid var(--line)}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:800 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* hero (passbook ruled card) */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;background:var(--accent);color:var(--accent-ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 25px,color-mix(in srgb,var(--accent-ink) 9%,transparent) 25px 26px)}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:54px;width:1px;background:color-mix(in srgb,var(--accent-ink) 16%,transparent)}
.hero>*{position:relative;z-index:1;padding-left:48px}
.hero .lbl{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero .big{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;font-weight:600;opacity:.92}
.hero .mark{position:absolute;left:14px;top:18px;padding:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 16px/1 var(--f-display);background:color-mix(in srgb,var(--accent-ink) 16%,transparent)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.tile .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.tile .v{font:700 clamp(15px,4.3vw,17px)/1.2 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.v.inc,.amt.inc{color:var(--income)} .v.exp,.amt.exp{color:var(--expense)} .amt.trf{color:var(--transfer)}

/* month summary */
.msum{padding:14px;display:flex;flex-direction:column;gap:12px}
.msum .rowx{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.msum h3{margin:0;font:700 16px/1.2 var(--f-display)}

/* accounts strip */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:none;width:158px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.acc .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;min-width:0}
.acc .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .b{font:700 18px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.acc .s{font-size:11.5px;color:var(--muted);font-weight:600}
.acc.add{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;font-weight:700;width:120px}
.emo{font-size:18px;line-height:1}

/* transaction rows */
.txlist{padding:2px 14px}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;text-align:left}
.tx:last-child{border-bottom:0}
.ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#8D99AE) 20%,transparent);color:var(--ink)}
.ci.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.tx-title{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.tx-meta .ic{opacity:.8}
.tx .amt{font-weight:800;font-size:15px;white-space:nowrap}
.tx.future{opacity:.62}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.pill.acc-p{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:12.5px;font-weight:800;color:var(--muted)}
.dayhead:first-child{padding-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font:700 16px/1.3 var(--f-display)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink)}
.banner .ic{color:var(--accent);margin-top:2px}
.banner p{margin:0;font-size:13.5px;font-weight:600}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.warn .ic{color:var(--warn)}

/* chips & segmented */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--accent)}
.chip small{font-weight:600;opacity:.75}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.t-expense{color:var(--expense)} .seg button.on.t-income{color:var(--income)} .seg button.on.t-transfer{color:var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;min-height:46px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-field{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-bottom:2px solid var(--line);padding:4px 2px;text-align:left;cursor:text;color:inherit}
.amount-field.active{border-color:var(--accent)}
.amt-text{font:800 38px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
.amt-text.ph{color:var(--muted);opacity:.55}
.t-expense .amt-text:not(.ph){color:var(--expense)} .t-income .amt-text:not(.ph){color:var(--income)} .t-transfer .amt-text:not(.ph){color:var(--accent)}
.caret{flex:none;width:2px;height:34px;border-radius:2px;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keypad-amt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kp{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 22px/1 var(--f-display);color:var(--ink);display:grid;place-items:center}
.kp.op{background:var(--surface-2);color:var(--accent)}
.kp.done{grid-column:span 2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font:800 16px/1 var(--f-body)}
.kp:active{transform:scale(.96)}
.amount-field .cur{font:700 30px/1 var(--f-display);color:var(--muted)}
.amount-field input{border:0;background:none;box-shadow:none!important;padding:4px 0;font:800 38px/1.1 var(--f-display);letter-spacing:-.02em;min-height:0}
.t-expense .amount-field input{color:var(--expense)} .t-income .amount-field input{color:var(--income)} .t-transfer .amount-field input{color:var(--accent)}
.calc{font-size:13px;font-weight:700;color:var(--muted);min-height:18px}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 8px;border-radius:14px;border:1px solid transparent;background:none;min-width:0}
.cat span:last-child{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.toggle-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.toggle-row>span:nth-child(2){flex:1;min-width:0}
.toggle-row b{display:block;font-size:14.5px}
.toggle-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(18px)}
.emi-box{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.emi-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.emi-sum b{display:block;font:700 16px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.receipt-thumb{display:flex;gap:12px;align-items:center}
.receipt-thumb img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.from-sms{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 14.5px/1.1 var(--f-body);border-radius:12px;padding:13px 16px;border:1px solid transparent;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--expense);color:#fff}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* tab bar + fab */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
#tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted)}
#tabbar button.on{color:var(--accent)}
#fab{position:fixed;z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);
  right:max(16px,calc(50% - 280px + 16px));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:560px;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:94vh;height:94dvh}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.dlg{align-items:center;padding:16px}
.sheet.dialog{border-radius:18px;max-width:400px;transform:scale(.96);opacity:0;transition:transform .18s,opacity .18s}
.sheet-wrap.open .sheet.dialog{transform:none;opacity:1}
.sh-head{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.sh-head h3 .ic{display:inline-block;vertical-align:-3px;margin-right:6px}
.sh-head h3{margin:0;text-align:center;font:700 16.5px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;flex:1;overscroll-behavior:contain}
.sh-foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}
.confirm p{margin:0;font-size:15px;font-weight:600}

/* lists in More / managers */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:left}
.rowi:last-child{border-bottom:0}
.rowi .tt{flex:1;min-width:0}
.rowi .tt b{display:block;font-weight:700;font-size:14.5px}
.rowi .tt small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .ic.chev{color:var(--muted)}
.rowi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.theme-sw{border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:12px;font-weight:800}
.theme-sw.on{border-color:var(--accent)}
.theme-sw i{display:block;height:44px;border-radius:9px;position:relative;overflow:hidden}
.theme-sw i::after{content:"";position:absolute;right:8px;bottom:8px;width:16px;height:16px;border-radius:5px;background:var(--sw-a)}

/* budgets */
.bud{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.bud:last-child{border-bottom:0}
.bud .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.bud .l1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud .l2 span{display:inline-flex;align-items:center;gap:4px}
.bud .l2{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:7px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--income)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--expense)}
.st-ok{color:var(--income)} .st-warn{color:var(--warn)} .st-over{color:var(--expense)}

/* stats */
.chart{padding:14px 12px 10px}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 8px}
.chart-h b{font:700 15px/1.2 var(--f-display)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--muted);font:700 10px var(--f-body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avg-line{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.chart svg text.avg-label{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.sel{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.readout{font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 4px 0;min-height:24px}
.readout b{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);padding:0 4px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.catrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left}
.catrow:last-child{border-bottom:0}
.catrow .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.catrow .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.hbar>i{display:block;height:100%;border-radius:99px;background:var(--c-out)}
.subrows{grid-column:2/4;display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.subrows div{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.mtable{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mtable th,.mtable td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable th{color:var(--muted);font-weight:800;border-top:0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* detection */
.detect{display:flex;flex-direction:column;gap:12px;padding:16px}
.detect .dc-amt{font:800 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv span{color:var(--muted);font-weight:700}
.kv b{font-weight:700;overflow-wrap:anywhere}
.sms-raw{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px;margin:8px 0 0;overflow-wrap:anywhere}
.det-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.det-item:last-child{border-bottom:0}
.det-item input{width:20px;height:20px;accent-color:var(--accent)}
.warn-note{margin:0;font-size:12.5px;font-weight:700;color:var(--warn)}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.codeline{display:flex;gap:8px;align-items:center}
.codeline code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px}

.welcome{padding:26px 20px 20px;display:flex;flex-direction:column;gap:14px}
.welcome .logo{width:72px;height:72px;filter:drop-shadow(0 8px 18px rgb(0 0 0 / .28))}
.welcome h2{margin:0;font:800 28px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.welcome p{margin:0;color:var(--muted);font-weight:600}
.welcome ul{margin:0;padding-left:18px;color:var(--ink);font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:4px}

.viewer img{width:100%;border-radius:12px;display:block}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,12px);z-index:90;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.banner.danger{background:color-mix(in srgb,var(--expense) 14%,var(--surface))}
.banner.danger .ic{color:var(--expense)}
.due{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0}
.due-main{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;min-width:0}
.due .t{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due .s{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.due.over .s{color:var(--expense)} .due.soon .s{color:var(--warn)}
.due .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.due .r b{font-weight:800;font-size:14.5px}
a.chip{text-decoration:none}
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock-in .logo{width:72px;height:72px;filter:drop-shadow(0 8px 18px rgb(0 0 0 / .28))}
.lock-in h2{margin:0;font:800 24px/1.15 var(--f-display)}
.lmsg{margin:0;font-weight:700;color:var(--muted)} .lmsg.bad{color:var(--expense)}
.dots{display:flex;gap:16px;margin:4px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:6px}
.keypad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 25px/1 var(--f-display);color:var(--ink)}
.keypad button:active{background:var(--accent-soft)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.taxrow{border-bottom:1px solid var(--line)} .taxrow:last-child{border-bottom:0}
.tx-main-btn{display:block;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.tx-main-btn .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px}
.tx-main-btn .l2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.taxdetail{display:flex;flex-direction:column;gap:6px;padding:0 0 12px;align-items:flex-start}
.taxitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.taxitem>span:first-child{min-width:0}
.taxitem b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taxitem small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.amt-row{display:flex;align-items:flex-end;gap:8px}
.amt-row .amount-field{flex:1;min-width:0}
.cur-btn{flex:none;display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;margin-bottom:6px;font:800 20px/1 var(--f-display);color:var(--ink)}
.cur-btn small{font:800 11px/1 var(--f-body);letter-spacing:.04em;color:var(--muted)}
.fxline{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.fxline b{color:var(--ink);font-size:14px}
.hero-eye{position:absolute;z-index:3;top:12px;right:12px;padding:0!important;width:36px;height:36px;border-radius:10px;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:var(--accent-ink)}
.emirow{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.emirow:last-child{border-bottom:0}
.emirow .l1{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.emirow .l2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.spike{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;gap:10px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.spike:last-child{border-bottom:0}
.spike b{display:flex;align-items:center;gap:5px;font-size:14px}
.spike.over b{color:var(--expense)} .spike.pace b{color:var(--warn)}
.spike p{margin:4px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.spike .icon-btn{width:32px;height:32px}
.qadd{display:flex;align-items:center;gap:8px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;font-weight:700;font-size:13px;color:var(--ink);max-width:220px}
.qadd .ci{width:30px;height:30px;font-size:15px;border-radius:9px}
.qadd span:last-child{display:flex;flex-direction:column;min-width:0;text-align:left}
.qadd small{color:var(--muted);font-weight:700}
.qadd b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.icon-grid button{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:21px}
.icon-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
.icon-grp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}
.sec-h{align-items:center}
.fold{display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px 6px 0;margin:-6px 0;color:var(--muted);min-height:36px;min-width:0;text-align:left}
.fold svg{flex:none;transition:transform .18s}
.fold h2{white-space:nowrap}
.sec-h>span{min-width:0;text-align:right}
.sec.folded .fold svg{transform:rotate(-90deg)}
.sec.folded>:not(.sec-h){display:none}
.sec.folded .sec-h>.link,.sec.folded .sec-h>span{display:none}
.fold-sum{display:none;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.folded .fold-sum{display:inline}
.mini-body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.mini{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
.mini-top{display:flex;align-items:center;gap:10px}
.mini-top .logo-sm{width:32px;height:32px;flex:none}
.mini-top .mt{display:flex;flex-direction:column;min-width:0}
.mini-top b{font:800 16px/1.2 var(--f-display)}
.mini-top small{font-size:12px;font-weight:600;color:var(--muted)}
.mini-amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--accent);padding:2px 0}
.mini-amt span{font:800 26px/1 var(--f-display);color:var(--muted)}
.mini-amt input{flex:1;min-width:0;border:0!important;background:none!important;box-shadow:none!important;outline:0!important;font:800 32px/1.1 var(--f-display);color:var(--ink);padding:0;height:auto}
.mini-in{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 10px;font:600 14px var(--f-body)}
.mini .chips{gap:6px}
.mini .chip{font-size:13px;padding:6px 10px}
.mini .chip.sm{font-size:12px;padding:4px 9px}
.mini select.chip{appearance:auto;background:var(--surface);color:var(--ink)}
.mini kbd{font:700 10px var(--f-body);opacity:.75;border:1px solid currentColor;border-radius:4px;padding:1px 4px;margin-left:6px}
.mini-msg{min-height:18px;font-size:13px;font-weight:700;color:var(--income)}
.mini-msg.err{color:var(--expense)}
.mini-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mini-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:5px 0;border-bottom:1px solid var(--line)}
.mini-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row b.exp{color:var(--expense)} .mini-row b.inc{color:var(--income)}
.mini-empty{margin:0;font-size:13px;color:var(--muted)}
.mini-lock{align-items:center;text-align:center;padding-top:60px;color:var(--muted)}
.mini-lock b{color:var(--ink);font-size:16px}
.tx{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.selecting #fab{display:none}
body.selecting .tx{position:relative;padding-left:44px}
body.selecting .tx::before{content:"";position:absolute;left:12px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:7px;border:2px solid var(--line-strong,var(--muted));box-sizing:border-box}
body.selecting .tx.sel{background:var(--accent-soft)}
body.selecting .tx.sel::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--bg)}
body.selecting .dayhead{cursor:pointer}
#selbar{position:fixed;left:0;right:0;z-index:22;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);padding:0 12px;pointer-events:none}
#selbar .sb-in{pointer-events:auto;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
#selbar .sb-l{flex:1;min-width:0;display:flex;flex-direction:column}
#selbar .sb-l b{font:800 20px/1.15 var(--f-display)}
#selbar .sb-l small{font-size:12px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selbar .icon-btn{color:var(--bg)}
.empty.slim{padding:18px 16px;flex-direction:row;justify-content:space-between;text-align:left}
.empty.slim b{font-size:15px}
.bill-top{display:flex;gap:12px;align-items:flex-start}
.bill-top img{width:62px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.bill-items{padding:0}
.bill-item{display:grid;grid-template-columns:minmax(0,1fr) 92px 30px;gap:2px 6px;align-items:center;padding:6px 8px 8px 10px;border-bottom:1px solid var(--line)}
.bill-item:last-child{border-bottom:0}
.bill-item .bi-name,.bill-item .bi-amt{border:1px solid transparent;background:transparent;font:600 14px/1.3 var(--f-body);color:var(--ink);padding:6px;border-radius:8px;min-width:0;width:100%;box-sizing:border-box}
.bill-item .bi-amt{text-align:right;font-weight:800}
.bill-item input:focus{border-color:var(--accent);background:var(--surface);outline:0}
.bill-item .pill{grid-column:1/3;justify-self:start;border:0;font-size:12px;cursor:pointer;margin-left:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-item .pill.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--ink)}
.bill-item .icon-btn{width:30px;height:30px}
.safe-list>span{display:flex;gap:8px;align-items:flex-start}
.safe-list svg{flex:none;margin-top:1px}
.sl-ok svg{color:var(--income)} .sl-bad svg{color:var(--expense)}
textarea.one-line{resize:none;min-height:46px;height:46px;line-height:22px;overflow:hidden;white-space:pre}
.bill-item textarea.one-line{min-height:0;height:34px;line-height:20px;padding:6px}
.bill-item textarea:focus{border-color:var(--accent);background:var(--surface);outline:0;box-shadow:none}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg[hidden]{display:none}
.sugg .chip{font-size:13px;padding:6px 11px}
.ocr-raw{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto;background:var(--surface-2);padding:8px;border-radius:8px;margin:8px 0}
.banner.ok{background:color-mix(in srgb,var(--income) 13%,var(--surface))}
.banner.ok .ic{color:var(--income)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.cat-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* ---- v1.7: transaction form: big amount, ledger card of fields, pickers docked at the bottom ---- */
.sheet.full{max-width:560px}
@media (max-width:600px){.sheet.full{height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;border-radius:0}}
.tf-head{grid-template-columns:44px minmax(0,1fr) auto}
.tf-head h3{text-align:left;padding-left:2px}

.tf-amt .amt-text{font:800 38px/1.15 var(--f-display);letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tf-card{padding:0;overflow:hidden}
.tf-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;text-align:left;color:var(--ink);font:inherit;position:relative;min-height:60px}
.tf-row .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.tf-row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tf-row small{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tf-row b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-row b .ph{color:var(--muted);font-weight:600}
.tf-row>.ic:last-child{color:var(--muted)}
.tf-row.on{background:var(--accent-soft)}
.tf-row.on::before,.tf-in:focus-within::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.tf-date{border-bottom:0}
.tf-date b{display:flex;gap:8px;align-items:center;overflow:visible}
.tf-pick{position:relative;cursor:pointer}
.tf-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0;cursor:pointer}
.tf-days{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px 60px;border-bottom:1px solid var(--line)}
.chip.sm{padding:5px 10px;font-size:12px}
.tf-in{border-bottom:0}
.tf-in label{cursor:text}
.tf-in .rt textarea{border:0;background:none;box-shadow:none!important;padding:2px 0;min-height:0;height:26px;line-height:22px;font-size:15.5px;font-weight:700;border-radius:0;outline:none}
.tf-in .rt textarea::placeholder{color:var(--muted);font-weight:600;opacity:.8}
.tf-card .sugg{padding:0 14px 12px 60px;margin:0}
.tf-extras{gap:8px}
.tf-note{font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:-4px}
.tf-foot .btn.primary{flex:1.35}
.tp{flex:none;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-height:57%;min-height:0;box-shadow:0 -10px 28px rgb(0 0 0 / .22);position:relative;z-index:1}

.tp-h>span{display:flex;align-items:center;gap:8px}

.tp-cat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);min-height:0;flex:1;overflow:hidden;border-top:1px solid var(--line)}
.tp-cats{overflow-y:auto;overscroll-behavior:contain;min-height:0;border-right:1px solid var(--line);padding:6px}

.tp-cats .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-cats button.on{background:var(--accent-soft);font-weight:800}
.tp-cats button.on .em{background:var(--accent)}
.tp-subs{overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:10px 12px}
.tp-cap{margin:2px 0 10px;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tp-subs .chips{gap:7px}
.tp-subs .chip{white-space:normal;text-align:left}
.tp-addsub{display:flex;gap:6px;align-items:center;margin-top:10px}

.tp-accs{overflow-y:auto;min-height:0;border-top:1px solid var(--line)}

.tp-accs .em{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:16px;flex:none}
.tp-accs .nm{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-accs .nm small{color:var(--muted);font-size:12px;font-weight:600}
.tp-accs .bal{color:var(--muted);font-size:13px;font-weight:700}

.tp-ops{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 10px 6px;flex:none}

.tp-kp{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(46px,7vh,58px);gap:6px;padding:2px 10px 12px;flex:none}

.tp-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}

.ask-body{gap:12px}
.ask-intro p{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:14px}

.me-b{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:16px 16px 4px 16px;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}

.ar{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}

.ar .ab{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}

.lend-due{flex-basis:100%;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;font-weight:700;color:var(--warn)}

/* ---- goals ---- */

.goal-top{display:flex;align-items:center;gap:12px}
.goal-top .tt{flex:1;min-width:0}

.goal-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:21px;flex:none}

.goal-num{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}

.gr-t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.gr-t b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-t .num{font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap}
.gr-m .bar{margin-top:4px}

.acct-card .tt{flex:1;min-width:0}
.acct-card .tt b{display:block;font-size:15.5px}
.acct-card .tt small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-card .chev{color:var(--muted)}
.acct{display:flex;flex-direction:column;gap:12px}
.acct-top{display:flex;align-items:center;gap:12px}
.acct-top .tt b{display:block;font-size:16px} .acct-top .tt small{display:block;color:var(--muted);font-weight:600}
.btn.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:700}
.prof-row{padding:0;gap:0}
.prof-main{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;text-align:left;color:var(--ink);min-width:0}
.prof-main .tt{flex:1;min-width:0}
.prof-main .ic{color:var(--accent)}
.prof-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:19px;flex:none}

.logo-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.lp{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;color:var(--ink);font-size:12px;font-weight:800}

<script>
'use strict';
const APP_VERSION = '1.8.1';

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const round2 = n => Math.round((+n || 0) * 100) / 100;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseYmd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const monthEnd = mk => { const [y, m] = mk.split('-').map(Number); return `${mk}-${pad(new Date(y, m, 0).getDate())}`; };
const shiftMonth = (mk, n) => addMonths(mk + '-01', n).slice(0, 7);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate = s => { const d = parseYmd(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parseYmd(s); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const fmtDay = s => { const t = today(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; if (s === addDays(t, 1)) return 'Tomorrow';
  const d = parseYmd(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, signed) => { n = round2(n); const a = Math.abs(n); const s = (Math.round(a * 100) % 100 ? nf2 : nf0).format(a);
  return (n < 0 ? '−' : (signed && n > 0 ? '+' : '')) + '₹' + s; };
const compact = n => { const a = Math.abs(n); let s;
  if (a >= 1e7) s = (+(a / 1e7).toFixed(a >= 1e9 ? 0 : 2)) + 'Cr';
  else if (a >= 1e5) s = (+(a / 1e5).toFixed(a >= 1e6 ? 1 : 2)) + 'L';
  else if (a >= 1e3) s = (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
  else s = String(Math.round(a));
  return (n < 0 ? '−' : '') + '₹' + s; };
const rupees = n => Math.abs(n) >= 1e7 ? compact(n) : money(Math.round(n));
const tileAmt = n => { const r = rupees(n); return r.replace('−', '').length > 8 ? compact(n) : r; };
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const normKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 30);

/* safe calculator for the amount field: 120+80, 1500/3 … */
function evalAmount(str) {
  str = String(str || '').replace(/[₹,\s]/g, '').replace(/[x×]/gi, '*').replace(/÷/g, '/');
  if (!str) return 0;
  if (!/^[0-9+\-*/().]+$/.test(str)) return NaN;
  let i = 0; const peek = () => str[i];
  const num = () => { const s = i; while (i < str.length && /[0-9.]/.test(str[i])) i++; const v = parseFloat(str.slice(s, i)); if (isNaN(v)) throw 0; return v; };
  const factor = () => { if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; } if (peek() === '-') { i++; return -factor(); } return num(); };
  const term = () => { let v = factor(); while (peek() === '*' || peek() === '/') { const op = str[i++]; const r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (peek() === '+' || peek() === '-') { const op = str[i++]; const r = term(); v = op === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); if (i !== str.length || !isFinite(v)) return NaN; return round2(v); } catch (e) { return NaN; }
}

/* ---------------- storage ---------------- */
const DB = {
  db: null, fallback: false, mem: new Map(),
  open() { return new Promise((res, rej) => { if (!('indexedDB' in window)) return rej(new Error('no idb'));
    const r = indexedDB.open('hisaab', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('receipts'); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  run(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
    if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  get(st, k) { if (this.fallback) return Promise.resolve(st === 'kv' ? JSON.parse(localStorage.getItem('hisaab-' + k) || 'null') : this.mem.get(k)); return this.run(st, 'readonly', s => s.get(k)); },
  put(st, k, v) { if (this.fallback) { if (st === 'kv') localStorage.setItem('hisaab-' + k, JSON.stringify(v)); else this.mem.set(k, v); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.put(v, k)); },
  del(st, k) { if (this.fallback) { this.mem.delete(k); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.delete(k)); },
  keys(st) { if (this.fallback) return Promise.resolve([...this.mem.keys()]); return this.run(st, 'readonly', s => s.getAllKeys()); },
  clear(st) { if (this.fallback) { this.mem.clear(); return Promise.resolve(); } return this.run(st, 'readwrite', s => s.clear()); }
};

/* ---------------- lookups & money maths ---------------- */
const accById = id => S.accounts.find(a => a.id === id);
const catById = id => S.categories.find(c => c.id === id);
const subName = (c, sid) => (c && c.subs.find(s => s.id === sid)?.name) || '';
const activeAccounts = () => S.accounts.filter(a => !a.archived && a.type !== 'people');
const isLiab = a => ACC_TYPES[a?.type]?.liab;
const fallbackCat = type => S.categories.find(c => c.type === type && /^(others|other income)$/i.test(c.name)) || S.categories.find(c => c.type === type);
function defaultAccountId() { const d = S.settings.defaultAccount; if (d && accById(d) && !accById(d).archived) return d;
  return (activeAccounts().find(a => a.type === 'bank') || activeAccounts()[0])?.id || ''; }
function balances() {
  const b = {}; S.accounts.forEach(a => b[a.id] = +a.opening || 0); const td = today();
  for (const t of S.txns) { if (t.date > td) continue;
    if (t.type === 'expense') b[t.accountId] = (b[t.accountId] || 0) - t.amount;
    else if (t.type === 'income') b[t.accountId] = (b[t.accountId] || 0) + t.amount;
    else { b[t.accountId] = (b[t.accountId] || 0) - t.amount; b[t.toAccountId] = (b[t.toAccountId] || 0) + t.amount; } }
  for (const k in b) b[k] = round2(b[k]); return b;
}
function rangeTotals(from, to) { let inc = 0, exp = 0; for (const t of S.txns) { if (t.date < from || t.date > to) continue; if (t.type === 'income') inc += t.amount; else if (t.type === 'expense') exp += t.amount; } return { inc: round2(inc), exp: round2(exp) }; }
function catSpent(catId, mk) { const from = mk + '-01', to = [monthEnd(mk), today()].sort()[0]; let s = 0;
  for (const t of S.txns) if (t.type === 'expense' && t.catId === catId && t.date >= from && t.date <= to) s += t.amount; return round2(s); }
function txTitle(t) {
  if (t.payee) return t.payee;
  if (t.type === 'transfer') return `${accById(t.accountId)?.name || '—'} → ${accById(t.toAccountId)?.name || '—'}`;
  const c = catById(t.catId); return subName(c, t.subId) || c?.name || 'Uncategorised';
}
function sortTx(a, b) { return (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')) || (b.createdAt || 0) - (a.createdAt || 0); }

/* ---------------- no autofill bar ----------------
   Chrome on Android shows a white password/card/address bar above the keyboard for every text box.
   A one-line textarea never gets it, so text boxes are drawn as one-line textareas. */
function noBar(html) {
  return String(html).replace(/<input\b([^>]*)>/g, (m, a) => {
    if (!/\stype="(text|search|number)"/.test(a)) return m;
    let val = ''; a = a.replace(/\svalue="([^"]*)"/, (x, v) => { val = v; return ''; });
    const num = /\stype="number"/.test(a); a = a.replace(/\s(type|list|min|max|step)="[^"]*"/g, '');
    if (num && !/inputmode=/.test(a)) a += ' inputmode="decimal"';
    a = /\sclass="/.test(a) ? a.replace(/\sclass="/, ' class="one-line ') : a + ' class="one-line"';
    return `<textarea rows="1" wrap="off" enterkeyhint="done" autocomplete="off"${a}>${val}</textarea>`;
  }).replace(/<datalist\b[\s\S]*?<\/datalist>/g, '');
}
document.addEventListener('keydown', e => { const el = e.target; if (e.key !== 'Enter' || !el.matches?.('textarea.one-line')) return; e.preventDefault();
  el.dispatchEvent(new Event('change', { bubbles: true })); setTimeout(() => { if (document.activeElement === el && !['cfNewSub', 'newSubName'].includes(el.id)) el.blur(); }, 0); });
document.addEventListener('input', e => { const el = e.target; if (el.matches?.('textarea.one-line') && /[\r\n]/.test(el.value)) { const p = el.selectionStart; el.value = el.value.replace(/[\r\n]+/g, ' '); try { el.setSelectionRange(p, p); } catch (er) {} } }, true);

/* ---------------- sheets (bottom panels) ---------------- */
const sheets = []; let ignorePop = 0, histPushed = false;
function openSheet(html, opts = {}) {
  const wrap = document.createElement('div'); wrap.className = 'sheet-wrap' + (opts.dialog ? ' dlg' : '');
  wrap.innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="sheet ${opts.cls || ''}${opts.dialog ? ' dialog' : ''}" role="dialog" aria-modal="true">${noBar(html)}</div>`;
  $('#layer').appendChild(wrap); requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  sheets.push({ wrap, onClose: opts.onClose }); document.body.classList.add('locked');
  if (!histPushed && ignorePop === 0) { try { history.pushState({ hs: 1 }, ''); histPushed = true; } catch (e) {} } // if a "back" is still on its way, push after it lands (see popstate)
  return wrap;
}
function closeSheet(fromPop) {
  const s = sheets.pop(); if (!s) return;
  s.wrap.classList.remove('open'); setTimeout(() => s.wrap.remove(), 260);
  if (!sheets.length) document.body.classList.remove('locked');
  if (fromPop) { histPushed = false; if (sheets.length) { try { history.pushState({ hs: 1 }, ''); histPushed = true; } catch (e) {} } }
  else if (!sheets.length && histPushed) { histPushed = false; ignorePop++; history.back(); }
  s.onClose && s.onClose();
}
addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; if (!ignorePop && sheets.length && !histPushed) { try { history.pushState({ hs: 1 }, ''); histPushed = true; } catch (e) {} } return; }
  if (sheets.length) closeSheet(true);
});
const setSheet = (wrap, html) => { $('.sheet', wrap).innerHTML = noBar(html); };
const head = (title, right = '') => `<div class="sh-head"><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ic('x')}</button><h3>${esc(title)}</h3>${right || '<span></span>'}</div>`;
function confirmBox(msg, okLabel = 'Delete', danger = true) {
  return new Promise(res => {
    let result = false;
    const w = openSheet(`<div class="sh-body confirm"><p>${esc(msg)}</p></div><div class="sh-foot"><button class="btn ghost" data-act="cfNo">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="cfYes">${esc(okLabel)}</button></div>`, { dialog: true, onClose: () => res(result) });
    w._yes = () => { result = true; };
  });
}

/* card statement SMS ("Total amt due … Min amt due … due date") */
function parseStatementSms(raw) {
  const text = String(raw || '').replace(/\s+/g, ' ').trim();
  if (!/card/i.test(text) || !/due/i.test(text)) return null;
  const AMT = '[^0-9]{0,20}?([0-9][0-9,]*(?:\\.[0-9]{1,2})?)';
  let tot = null;
  for (const k of ['total (?:amount |amt\\.? )?(?:due|outstanding|payable)', 'statement (?:amount|balance|outstanding)', 'total due']) { tot = text.match(new RegExp(k + AMT, 'i')); if (tot) break; }
  if (!tot) return null;
  const min = text.match(new RegExp('(?:min(?:imum)?\\.?\\s*(?:amount|amt)?\\.?\\s*due|\\bMAD\\b)' + AMT, 'i'));
  const dk = text.match(/(?:payment due date|due date|due by|due on|pay by|payable by)\s*(?:is|:|-|of)?\s*/i);
  const due = dk ? parseDateAny(text.slice(dk.index + dk[0].length, dk.index + dk[0].length + 24)) : '';
  const l4 = text.match(/(?:card|a\/c|account)[^0-9]{0,30}?(?:[x*]{2,}|ending\s*(?:with|in)?\s*)(\d{4})\b/i) || text.match(/[x*]{2,}(\d{4})\b/i);
  const total = round2(parseFloat(tot[1].replace(/,/g, ''))); if (!(total > 0)) return null;
  return { total, min: min ? round2(parseFloat(min[1].replace(/,/g, ''))) : null, due, last4: l4 ? l4[1] : '', text };
}

function lumpIds() {
  const g = {}, out = new Set();
  for (const t of S.txns) if (t.type === 'expense' && t.amount >= 1000) (g[t.catId + '|' + (normKey(t.payee) || t.subId)] ||= []).push(t);
  for (const list of Object.values(g)) for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j], d = Math.abs(daysBetween(a.date, b.date));
    if (d >= 80 && d <= 400 && Math.abs(a.amount - b.amount) <= Math.max(a.amount, b.amount) * .1) { out.add(a.id); out.add(b.id); }
  }
  for (const b of S.bills) if (lumpyBill(b)) for (const t of S.txns) if (t.type === 'expense' && t.payee && normKey(t.payee) === normKey(b.name)) out.add(t.id);
  return out;
}

/* ---------------- Home: today and the days before ---------------- */
function learnedCat(payee, type) { const k = normKey(payee); if (!k) return null; const m = S.payeeMap[k]; if (m && m.type === type && catById(m.catId)) return m;
  const t = S.txns.filter(x => x.type === type && x.catId && normKey(x.payee) === k).sort(sortTx)[0]; return t && catById(t.catId) ? { catId: t.catId, subId: t.subId } : null; }
function payeeSugg(el) {
  const box = $('#tfPayeeSugg'); if (!box) return; const q = el.value.trim().toLowerCase();
  if (q.length < 1) { box.hidden = true; return; }
  const cnt = new Map(); for (const t of S.txns) if (t.payee && (TF.type === 'transfer' || t.type === TF.type)) { const k = t.payee.trim(); cnt.set(k, (cnt.get(k) || 0) + 1); }
  const list = [...cnt.entries()].filter(([p]) => p.toLowerCase().includes(q) && p.toLowerCase() !== q).sort((a, b) => (b[0].toLowerCase().startsWith(q)) - (a[0].toLowerCase().startsWith(q)) || b[1] - a[1]).slice(0, 6);
  box.innerHTML = list.map(([p]) => `<button type="button" class="chip" data-act="tfPayeePick" data-v="${esc(p)}">${esc(p)}</button>`).join(''); box.hidden = !list.length;
}
document.addEventListener('pointerdown', e => { if (e.target.closest('.sugg')) e.preventDefault(); });
document.addEventListener('focusout', e => { if (e.target.id === 'tfPayee') setTimeout(() => { const b = $('#tfPayeeSugg'); if (b && document.activeElement?.id !== 'tfPayee') b.hidden = true; }, 200); });
function dayTotals(list) { let e = 0, i = 0; for (const t of list) { if (t.type === 'expense') e += t.amount; else if (t.type === 'income') i += t.amount; } return [e ? 'Spent ' + money(e) : '', i ? 'Got ' + money(i) : ''].filter(Boolean).join(' · '); }
function homeDaysHTML(td) {
  const from = addDays(td, -7), days = new Map();
  for (const t of S.txns) if (t.date <= td && t.date >= from) { if (!days.has(t.date)) days.set(t.date, []); days.get(t.date).push(t); }
  const tl = (days.get(td) || []).sort(sortTx); let h = '';
  h += `<section class="sec"><div class="sec-h"><h2>Today</h2><span class="small num" style="font-weight:800">${tl.length ? dayTotals(tl) : ''}</span></div>` +
    (tl.length ? `<div class="card txlist">${tl.map(txRow).join('')}</div>` : `<div class="card empty slim"><b>Nothing added today</b><button class="btn primary sm" data-act="newTx">${ic('plus', 16)} Add expense</button></div>`) +
    (tl.length && !S.settings.selTipSeen ? `<p class="small muted" style="margin:0;font-weight:600">Tip: press and hold an entry to select several and see their total.</p>` : '') + '</section>';
  const prev = [...days.keys()].filter(d => d < td).sort().reverse();
  if (prev.length) h += `<section class="sec"><div class="sec-h"><h2>Last 7 days</h2><button class="link" data-act="tab" data-v="txns">See all</button></div>` +
    prev.map(d => { const l = days.get(d).sort(sortTx); return `<div class="dayhead" data-day="${d}"><span>${fmtDay(d)}</span><span class="num">${dayTotals(l)}</span></div><div class="card txlist">${l.map(txRow).join('')}</div>`; }).join('') + '</section>';
  else if (!S.txns.some(t => t.date <= td)) h += `<div class="card empty"><b>No transactions yet</b><span>Tap + to add your first expense, or tap Ask AI to see what Hisaab can answer.</span></div>`;
  return h;
}

/* ---------------- select entries to add them up ---------------- */
let SEL = null, lpT = null, lpXY = null, lpFired = false;
function selStart(id) { SEL = new Set(id ? [id] : []); document.body.classList.add('selecting'); if (!S.settings.selTipSeen) { S.settings.selTipSeen = 1; save(); } markSel(); selBar(); }
function selEnd() { SEL = null; document.body.classList.remove('selecting'); $$('.tx.sel').forEach(r => r.classList.remove('sel')); $('#selbar')?.remove(); }
function selToggle(id) { if (SEL.has(id)) SEL.delete(id); else SEL.add(id); markSel(); selBar(); }
function markSel() { if (!SEL) return; $$('#view .tx[data-id]').forEach(r => r.classList.toggle('sel', SEL.has(r.dataset.id))); }
function selSums() { const list = S.txns.filter(t => SEL.has(t.id)); let e = 0, i = 0, tr = 0; for (const t of list) { if (t.type === 'expense') e += t.amount; else if (t.type === 'income') i += t.amount; else tr += t.amount; } return { list, e: round2(e), i: round2(i), tr: round2(tr) }; }
function selBar() {
  let bar = $('#selbar'); if (!bar) { bar = document.createElement('div'); bar.id = 'selbar'; bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', 'Selected total'); document.body.appendChild(bar); }
  const { list, e, i, tr } = selSums(), kinds = [e, i, tr].filter(Boolean).length;
  const main = !list.length ? 'Tap entries to add them up' : kinds > 1 ? `Net ${i - e >= 0 ? '+' : '−'}${money(Math.abs(i - e))}` : money(e || i || tr);
  const sub = !list.length ? 'Press and hold, or tap, to select' : `${list.length} selected` + (kinds > 1 ? ` · spent ${money(e)}${i ? ` · got ${money(i)}` : ''}${tr ? ` · moved ${money(tr)}` : ''}` : e ? ' · spent' : i ? ' · received' : ' · transfers');
  bar.innerHTML = `<div class="sb-in"><div class="sb-l"><b class="num">${main}</b><small>${sub}</small></div>${list.length ? `<button class="icon-btn" data-act="selCopy" aria-label="Copy total">${ic('copy', 19)}</button><button class="icon-btn danger" data-act="selDelete" aria-label="Delete selected">${ic('trash', 19)}</button>` : ''}<button class="btn sm primary" data-act="selDone">Done</button></div>`;
}
function releaseReceipt(rid) { if (rid && !S.txns.some(t => t.receipt === rid)) DB.del('receipts', rid).catch(() => {}); }
document.addEventListener('pointerdown', e => { const r = e.target.closest('#view .tx[data-id]'); if (!r || (e.pointerType === 'mouse' && e.button !== 0)) return; lpXY = [e.clientX, e.clientY]; lpFired = false; clearTimeout(lpT);
  lpT = setTimeout(() => { lpT = null; lpFired = true; if (!SEL) selStart(r.dataset.id); else selToggle(r.dataset.id); try { navigator.vibrate?.(15); } catch (er) {} }, 480); });
document.addEventListener('pointermove', e => { if (lpT && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10) { clearTimeout(lpT); lpT = null; } });
['pointerup', 'pointercancel', 'scroll'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(lpT); lpT = null; }, true));
document.addEventListener('contextmenu', e => { if (e.target.closest('#view .tx[data-id]')) e.preventDefault(); });
document.addEventListener('click', e => {
  if (lpFired && e.target.closest('#view .tx[data-id]')) { lpFired = false; e.preventDefault(); e.stopPropagation(); return; }
  lpFired = false; if (!SEL) return;
  const r = e.target.closest('#view .tx[data-id]'); if (r) { e.preventDefault(); e.stopPropagation(); selToggle(r.dataset.id); return; }
  const dh = e.target.closest('#view .dayhead[data-day], #view .dayhead'); if (dh) { const card = dh.nextElementSibling; const ids = card ? $$('.tx[data-id]', card).map(x => x.dataset.id) : []; if (ids.length) { e.preventDefault(); e.stopPropagation(); const all = ids.every(id => SEL.has(id)); ids.forEach(id => all ? SEL.delete(id) : SEL.add(id)); markSel(); selBar(); } }
}, true);

/* ---------------- safety copy to the phone ---------------- */
// Clearing browser data erases everything stored inside the browser, so once a day Hisaab also saves a copy to the Downloads folder, which survives that.
async function autoSafetyCopy() {
  if (!S || !S.settings.autoFile || S.settings.sample || !S.txns.length || LK.on) return;
  const td = today(); if (S.settings.lastAutoFile === td || PROF.lastAutoFile === td || (S.settings.lastChange || 0) <= (S.settings.lastAutoAt || 0)) return;
  S.settings.lastAutoFile = td; PROF.lastAutoFile = td; saveProf();
  try { const data = { app: 'Hisaab', format: 2, exportedAt: new Date().toISOString(), note: 'Daily safety copy. Receipt photos are only in full backups.', state: S, profiles: { active: PROF.active, list: PROF.list, states: await otherProfileStates() }, receipts: {} };
    downloadBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `Hisaab-backup-${td}.json`);
    markBackedUp(); S.settings.lastAutoAt = Date.now() + 1000;
    if (!S.settings.autoFileIntro && !sheets.length) { S.settings.autoFileIntro = 1; save(); openSheet(head('Your data is now protected') + `<div class="sh-body"><p style="margin:0">Once a day, Hisaab saves a copy of your data to this ${isAndroid ? "phone's" : "computer's"} <b>Downloads</b> folder (file name <b>Hisaab-backup-${td}.json</b>). If browser data is ever cleared, open Hisaab, tap <b>Restore my data</b> and pick the newest file.</p>${safeClearHTML()}<p class="small muted" style="margin:0;font-weight:600">Turn this off in More › Backup & restore. Old copies can be deleted from Downloads any time.</p></div><div class="sh-foot"><button class="btn primary" data-act="closeSheet">Got it</button></div>`); }
    else toast('Daily safety copy saved to your Downloads folder'); render();
  } catch (e) { S.settings.lastAutoFile = ''; }
}
document.addEventListener('pointerup', () => { if (S && S.settings.autoFile && S.settings.lastAutoFile !== today()) setTimeout(autoSafetyCopy, 400); }, true);
function restoreChoiceHTML() {
  return head('Restore my data') + `<div class="sh-body"><p style="margin:0">If you cleared your browser data or changed phones, bring everything back from a backup.</p>
    <button class="btn primary block" data-act="restore">${ic('folder', 18)} Choose a backup file</button>
    <span class="small muted" style="font-weight:600">Look in your <b>Downloads</b> folder for the newest <b>Hisaab-backup-…json</b> file (Hisaab saves one there every day), or a file you saved to Drive or WhatsApp.</span>
    <button class="btn ghost block" data-act="${S.settings.driveClientId ? 'driveRestore' : 'driveSetup'}">${ic('cloud', 18)} Restore from Google Drive</button>
    ${S.settings.driveClientId ? '' : '<span class="small muted" style="font-weight:600">You will need to paste your Google Client ID again. Find it at console.cloud.google.com › Google Auth Platform › Clients.</span>'}</div>`;
}
function safeClearHTML() {
  return `<div class="card pad small safe-list" style="font-weight:600;display:flex;flex-direction:column;gap:6px"><b style="font-size:14px">What is safe to clear</b>
    <span class="sl-ok">${ic('check', 15)}<span><b>Safe:</b> “Clear cache” and “Cached images and files”.</span></span>

const TF_TITLE = (f) => f.id ? 'Edit ' + TYPE_LABEL[f.type].toLowerCase() : f.type === 'transfer' ? 'Move money' : 'Add ' + TYPE_LABEL[f.type].toLowerCase();
